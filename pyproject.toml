[project]
name = "guidetodream"
version = "0.1.0"
description = "Personal European Higher-Studies Intelligence Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",          # async PostgreSQL driver
    "psycopg2-binary>=2.9.0",   # sync driver for Alembic migrations

    # Data validation & settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    # LLM
    "litellm>=1.40.0",
    "google-generativeai>=0.7.0",

    # Web research
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "pymupdf>=1.24.0",          # PDF parsing
    "tavily-python>=0.3.0",     # web search

    # Scheduling
    "apscheduler>=3.10.0",

    # Logging
    "structlog>=24.2.0",

    # Utilities
    "tenacity>=8.3.0",          # retry logic
    "python-dateutil>=2.9.0",   # date parsing
    "rich>=13.7.0",             # pretty terminal output
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",              # linting + formatting
    "mypy>=1.10.0",             # type checking
    "httpx>=0.27.0",            # for FastAPI test client
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in default arguments (FastAPI pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
